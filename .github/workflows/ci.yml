name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Enable Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
      - name: Architecture guards (file size / import direction)
        run: python3 tools/ci_guard.py
      - name: Compile androidTest and baselineprofile assets
        # 防止"写了但从不跑"的测试资产腐烂（20261002 体检 P1-6）：
        # androidTest 迁移/分页测试与 baselineprofile 至少保持可编译。
        # 注意：不能用 `:baselineprofile:assemble`——androidx.baselineprofile 插件的
        # assemble 会连带生成 baseline profile（connectedNonMinifiedReleaseAndroidTest），
        # 需要真机，CI 上必挂（20261004 首次远端触发即失败）。
        run: ./gradlew :app:assembleDebugAndroidTest :baselineprofile:assembleAndroidTest
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
