  .fam span{color:var(--muted);font-size:11.5px}
  .cols{display:flex;gap:10px;padding:0 18px 24px;align-items:flex-start}
  .panel{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}

  .tree{max-height:78vh;overflow:auto;padding:6px 4px 12px}

  .dir-head{cursor:pointer;padding:3px 8px;font-weight:600;color:#445;border-radius:5px;user-select:none}

  .dir-body{margin-left:10px;border-left:1px dashed var(--line);padding-left:6px}
  .dir.closed .dir-body{display:none}
  .row{display:flex;align-items:baseline;gap:7px;padding:2.5px 8px;border-radius:5px;cursor:pointer;line-height:1.45}
  .row:hover{background:#eef1f4}
  .row.hl{background:var(--hl);outline:1px solid var(--hl-edge)}
  .row.dim{opacity:.22}
  .row .nm{font-family:Consolas,monospace;white-space:nowrap}
  .row .lb{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ln{margin-left:auto;color:#aab2ba;font-size:11px;white-space:nowrap}
  .row .arrow{color:var(--mov);font-size:11px}
  .s-same .dot{background:var(--same)}
  .s-mod .dot{background:var(--mod)}
  .s-add .dot{background:var(--add)}
  .s-del .dot{background:var(--del)}
  .s-mov .dot{background:var(--mov)}
  .s-del .nm{text-decoration:line-through}

<script>
"use strict";
const P = "app/src/main/java/com/asmr/player/";
const rel = p => p.startsWith(P) ? p.slice(P.length) : p;

/* ---------- 基础数据准备 ---------- */
function buildTree(list, side){
  const root = {};
  for(const f of list){
    const r = rel(f.p), parts = r.split("/");
    let node = root;
    for(let i=0;i<parts.length-1;i++){
      const k = parts[i];
      node = node[k] || (node[k] = {});
    }
    node["\u0000f"] = node["\u0000f"] || [];
    node["\u0000f"].push({name:parts[parts.length-1], f});
  }
  return root;
}
function treeList(root, side){
  const rows = [];
  function walk(node, prefix){
    const dirs = Object.keys(node).filter(k=>k!=="\u0000f").sort();
    for(const d of dirs){
      const id = prefix + d;
      const files = [];
      collect(node[d], files);
      rows.push({type:"dir", id, name:d, n:files.length, prefix});
      walk(node[d], id + "/");
    }
    for(const fi of (node["\u0000f"]||[]).slice().sort((a,b)=>a.name.localeCompare(b.name)))
      rows.push({type:"file", id:prefix+fi.name, name:fi.name, f:fi.f});
  }
  function collect(node, out){
    for(const fi of (node["\u0000f"]||[])) out.push(fi.f);
    for(const k of Object.keys(node)) if(k!=="\u0000f") collect(node[k], out);
  }
  walk(root, "");
  return rows;
}

/* ---------- 渲染 ---------- */
const $=id=>document.getElementById(id);
const state = {sel:null, onlyChg:false, q:""};
function statusClass(st){return "s-"+st;}

function renderPanel(treeRows, side, mountId){
  const mount = $(mountId);
  mount.innerHTML = "";
  let curDirBody = null;
  const dirEls = {};
  for(const r of treeRows){
    if(r.type==="dir"){
      const d = document.createElement("div");
      d.className = "dir"; d.dataset.dir = r.id;
      const h = document.createElement("div");
      h.className = "dir-head";
      h.innerHTML = "▾ " + r.name + ` <span class="cnt">(${r.n})</span>`;
      h.onclick = ()=>{ d.classList.toggle("closed"); h.innerHTML = (d.classList.contains("closed")?"▸ ":"▾ ") + r.name + ` <span class="cnt">(${r.n})</span>`; };
      d.appendChild(h);
      const b = document.createElement("div"); b.className="dir-body";
      d.appendChild(b);
      mount.appendChild(d);
      curDirBody = b; dirEls[r.id] = {el:d, head:h};
      (r.prefix ? dirEls[r.prefix.slice(0,-1)].el.querySelector(".dir-body") : mount).appendChild(d);
    }else{
      const f = r.f;
      const row = document.createElement("div");
      row.className = "row " + statusClass(f.st);
      row.dataset.path = f.p; row.dataset.side = side;
      const meta = [];
      if(f.n) meta.push(f.n + " 行");
      if(f.st==="mov" && f.mv) meta.push("→ " + rel(f.mv));
      if(f.st==="mov" && f.mvFrom) meta.push("← " + rel(f.mvFrom));
      row.innerHTML = `<i class="dot"></i><span class="nm">${r.name}</span>` +
        `<span class="lb">${f.lb||""}${meta.length?' <span style="color:#b9c2ca">· '+meta.join(" · ")+"</span>":""}</span>`;
      row.onclick = ()=>selectFile(f.p, side);
      row.onmousemove = e=>showTip(e, f);
      row.onmouseleave = hideTip;
      curDirBody.appendChild(row);
    }
  }
  return dirEls;
}
function showTip(e,f){
  const t=$("tip");
  let s = rel(f.p);
  if(f.mv) s += "\n→ 重构后：" + rel(f.mv);
  if(f.mvFrom) s += "\n← 重构前：" + rel(f.mvFrom);
  if(f.gname) s += "\n业务组：" + f.gname;
  if(f.note) s += "\n" + f.note;
  t.textContent = s;
  t.style.display="block";
  t.style.left = Math.min(e.clientX+14, innerWidth-440)+"px";
  t.style.top = (e.clientY+14)+"px";
}
function hideTip(){ $("tip").style.display="none"; }

/* ---------- 选择 / 映射 ---------- */
function relatedOf(p, side){
  const out = new Set();
  const D = window.__MAP__;
  const rec = D.map[p];
  if(rec){
    if(rec.other) out.add(rec.other);          // 同路径对侧（含修改）
    if(rec.mv) out.add(rec.mv);                // 改名对侧
    if(rec.mvFrom) out.add(rec.mvFrom);
    (rec.groups||[]).forEach(g=>D.groups[g].members.forEach(m=>out.add(m))); // 所在业务组全体
  }
  return out;
}
function selectFile(p, side){
  if(state.sel===side+p){ clearSel(); return; }
  clearSel();
  state.sel = side+p;
  const rel1 = relatedOf(p, side); rel1.add(p);
  for(const row of document.querySelectorAll(".row")){
    const inSel = rel1.has(row.dataset.path);
    row.classList.toggle("hl", inSel);
    row.classList.toggle("dim", !inSel);
  }
  // 展开包含高亮行的目录
  document.querySelectorAll(".row.hl").forEach(rw=>{
    let el = rw.parentElement;
    while(el && el.classList){
      if(el.classList.contains("dir") && el.classList.contains("closed")){
        el.classList.remove("closed");
        const h = el.querySelector(".dir-head");
        const nm = el.dataset.dir.split("/").pop();
        h.innerHTML = "▾ " + nm + ` <span class="cnt">(${el.querySelectorAll(".row").length})</span>`;
      }
      el = el.parentElement;
    }
  });
  document.querySelector(state.sel.startsWith("L")?"#pL":"#pR").scrollIntoView({block:"nearest"});
}
function clearSel(){
  state.sel=null;
  document.querySelectorAll(".row.hl,.row.dim").forEach(r=>r.classList.remove("hl","dim"));
  document.querySelectorAll(".fam.f-on").forEach(x=>x.classList.remove("f-on"));
}
function selectGroup(gi){
  const D = window.__MAP__;
  const on = document.querySelector(`.fam[data-g="${gi}"]`).classList.contains("f-on");
  clearSel();
  if(on) return;
  document.querySelector(`.fam[data-g="${gi}"]`).classList.add("f-on");
  const mem = new Set(D.groups[gi].members);
  for(const row of document.querySelectorAll(".row")){
    row.classList.toggle("hl", mem.has(row.dataset.path));
    row.classList.toggle("dim", !mem.has(row.dataset.path));
  }
}

/* ---------- 过滤 ---------- */
function applyFilter(){
  const q = state.q.toLowerCase();
  for(const row of document.querySelectorAll(".row")){
    const f = window.__MAP__.map[row.dataset.path];
    const hit = (!q || row.textContent.toLowerCase().includes(q)) && (!state.onlyChg || (f && f.st!=="same"));
    row.style.display = hit ? "" : "none";
  }
  // 隐藏空目录
  document.querySelectorAll(".dir").forEach(d=>{
    const any = d.querySelector(".dir-body") && [...d.querySelectorAll(".row")].some(r=>r.style.display!=="none");
    const sub = [...d.querySelectorAll(".dir")].some(s=>s.style.display!=="none");
    d.style.display = (any||sub) ? "" : "none";
  });
}

/* ---------- 启动 ---------- */
const D = window.__MAP__;
$("stats").innerHTML = D.meta.stats.map(s=>`<div class="stat">${s[0]} <b>${s[1]}</b></div>`).join("");
$("fams").innerHTML = D.groups.map((g,i)=>
  `<div class="fam" data-g="${i}"><b>${g.name}</b><span>${g.desc}</span></div>`).join("");
document.querySelectorAll(".fam").forEach(el=>el.onclick=()=>selectGroup(+el.dataset.g));

const rowsL = treeList(buildTree(D.files.main,"L"),"L");
const rowsR = treeList(buildTree(D.files.head,"R"),"R");
renderPanel(rowsL,"L","treeL");
renderPanel(rowsR,"R","treeR");
$("cntL").textContent = "（" + D.files.main.length + " 文件）";
$("cntR").textContent = "（" + D.files.head.length + " 文件）";

$("q").oninput = e=>{state.q=e.target.value.trim(); applyFilter();};
$("b-chg").onclick = e=>{state.onlyChg=!state.onlyChg; e.target.classList.toggle("on",state.onlyChg); applyFilter();};
$("b-exp").onclick = ()=>document.querySelectorAll(".dir").forEach(d=>{
  d.classList.remove("closed");
  d.querySelector(".dir-head").innerHTML = "▾ " + d.dataset.dir.split("/").pop() + ` <span class="cnt">(${d.querySelectorAll(".row").length})</span>`;});
$("b-col").onclick = ()=>document.querySelectorAll(".dir").forEach(d=>{
  d.classList.add("closed");
  d.querySelector(".dir-head").innerHTML = "▸ " + d.dataset.dir.split("/").pop() + ` <span class="cnt">(${d.querySelectorAll(".row").length})</span>`;});
document.addEventListener("keydown",e=>{if(e.key==="Escape")clearSel();});
</script>
</body>
</html>
